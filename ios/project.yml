# iOS wrapper for the dashboard. The app bundles the repo's own pages (../*.html, topbar.js, sync.js)
# by copying them into the app's Web/ folder at build time, so there is one source of truth.
# Regenerate the Xcode project after editing this file:  cd ios && xcodegen generate
name: Row
options:
  bundleIdPrefix: com.hannesjonsson
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: JRH46HXFZR
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Row:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Dashboard
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Take progress photos in the Fitness tab.
        NSPhotoLibraryUsageDescription: Pick progress photos in the Fitness tab.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hannesjonsson.Row
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Copy dashboard pages
        basedOnDependencyAnalysis: false
        script: |
          set -e
          DEST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Web"
          rm -rf "$DEST" && mkdir -p "$DEST"
          cp "${SRCROOT}"/../*.html "${SRCROOT}"/../topbar.js "${SRCROOT}"/../sync.js "$DEST/"
