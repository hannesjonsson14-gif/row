<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Food</title>
<!-- defer: the page paints from localStorage without waiting on the CDN (offline, slow network). Deferred
     scripts run in this order, all before DOMContentLoaded, where initCloudSync is called. supabase-js goes
     last so the top bar and tab bar never wait for it: sync.js and topbar.js only read window.supabase from
     initCloudSync / later taps, never while loading. -->
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" defer></script>

<style>
/* ===================== row-tokens v1 =====================
   Paste as the FIRST rule of each page's first <style>, identical on every page.
   Then the page overrides only the 4 --accent* lines (see per-page accents).
   Contrast numbers are measured on --surface-1 over --bg (≈ #101011). */
:root {
  color-scheme: dark;

  /* ---- Base canvas (flat: no radial washes, no grain, no drift) ---- */
  --bg: #050506;                         /* page; also <meta name="theme-color"> on every page */
  --bg-elevated: #141416;                /* OPAQUE: sheets, modals, menus, workout session, overlays */
  --bg-chrome: rgba(8, 8, 9, 0.78);      /* top bar / tab bar / finance nav, always with --blur-material */

  /* ---- Surfaces: translucent white so they stack on any base (incl. inside the water iframe) ---- */
  --surface-1: rgba(255, 255, 255, 0.045);   /* card                       ≈ #101011 */
  --surface-2: rgba(255, 255, 255, 0.065);   /* row / field / tile in card ≈ #202020 */
  --surface-3: rgba(255, 255, 255, 0.10);    /* tonal button, pressed row  ≈ #282829 */
  --surface-active: rgba(255, 255, 255, 0.14); /* selected segment */
  --surface-sunken: rgba(0, 0, 0, 0.28);     /* legacy recessed well (being phased out for --surface-2) */
  --track: rgba(255, 255, 255, 0.08);        /* progress bar / ring track */

  /* ---- Lines ---- */
  --hairline: rgba(255, 255, 255, 0.06);       /* list separators, chrome edges */
  --border: rgba(255, 255, 255, 0.08);         /* card/control edge where one is needed */
  --border-strong: rgba(255, 255, 255, 0.16);
  --control-border: rgba(255, 255, 255, 0.36); /* unchecked checkbox ring: 3.3:1 (WCAG 1.4.11) */
  --edge-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.05); /* the "glass lip" on cards */

  /* ---- Text (warm neutrals) ---- */
  --text-1: #FAFAFA;   /* primary          16.9:1 */
  --text-2: #B8B6B0;   /* secondary         9.4:1 */
  --text-3: #94918A;   /* tertiary, placeholders: ≥5.0:1 on surface-2, 4.7:1 on surface-3. Lowest level for anything that carries information */
  --text-4: #5E5C57;   /* 2.9:1 — disabled + purely decorative glyphs ONLY, never information */
  --text-on-light: #0A0A0B; /* ink on porcelain / accent fills (16:1 on porcelain, ≥6.5:1 on every accent) */

  /* ---- Porcelain: the one primary-button material, shared by every page ---- */
  --porcelain: #F4F1EA;
  --porcelain-fill: linear-gradient(180deg, #FFFFFF 0%, #ECE9E2 100%); /* subtle material sheen, buttons only */

  /* ---- Semantic status (used only for status, never as decoration) ---- */
  --positive: #6BE3A4;  --positive-tint: rgba(107, 227, 164, 0.14);  /* 11.9:1 */
  --warning:  #F2C063;  --warning-tint:  rgba(242, 192, 99, 0.14);   /* 11.3:1 */
  --negative: #FF6B6B;  --negative-tint: rgba(255, 107, 107, 0.14);  /* 6.9:1, 5.7:1 on its tint */

  /* ---- Feature hues: each domain owns one; reused wherever that domain appears ---- */
  --hue-day:     #E07658;  /* Main: Day Ring, goals: ember   6.3:1 (5.3:1 on its tint) */
  --hue-health:  #7DD3FC;  /* Health stack + Water + top-bar water pill: sky  11.4:1 */
  --hue-food:    #F4F1EA;  /* Food: kcal: porcelain  16.9:1 */
  --hue-fitness: #6BE3A4;  /* Fitness: mint  11.9:1 */
  --hue-finance: #B58CFF;  /* Finance: violet  7.4:1 (6.1:1 on its tint) */
  --protein: #5CC8FF;  --carbs: #F2B04A;  --fat: #B58CFF;  /* macro DATA colours: bars/dots only */
  --data-1: #7DD3FC; --data-2: #6BE3A4; --data-3: #F2C063; --data-4: #B58CFF; --data-5: #E07658; /* finance categories / donut */

  /* ---- Page accent (each page overrides these four lines) ---- */
  --accent: var(--hue-day);
  --accent-ink: #0A0A0B;
  --accent-tint: rgba(224, 118, 88, 0.14);
  --accent-ring: rgba(224, 118, 88, 0.60);   /* focus outline + focused field border */

  /* ---- Type ---- */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --fs-micro: 11px;     /* eyebrows, tab labels, tags, axis labels (floor: nothing smaller) */
  --fs-caption: 12px;   /* row meta, helper text, mono sub-lines */
  --fs-footnote: 13px;  /* secondary text, segment/chip labels, field labels */
  --fs-body: 15px;      /* body, list-row titles, buttons */
  --fs-headline: 17px;  /* sheet titles, emphasized row values, large buttons */
  --fs-title-3: 20px;   /* "/ 7" denominators next to a hero, card titles */
  --fs-title-2: 22px;   /* secondary stat, food item name in sheet */
  --fs-title-1: 28px;   /* page title (26px at ≤360px) */
  --fs-display: 34px;   /* secondary hero (e.g. kcal on Main's food card, wishlist total) */
  --fs-hero: 48px;      /* the ONE number per screen */
  --fs-input: 16px;     /* every input/select/textarea: iOS will not zoom */
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700; /* 800 retired */
  --lh-tight: 1.05; --lh-snug: 1.25; --lh-body: 1.45;
  --tracking-hero: -0.035em; --tracking-title: -0.022em; --tracking-body: -0.005em;
  --tracking-eyebrow: 0.08em;  /* was 0.14–0.22em in 9 variants */

  /* ---- Space (4pt grid) ---- */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px;
  --space-6: 24px; --space-7: 28px; --space-8: 32px; --space-10: 40px;
  --gutter: 16px;        /* page side gutter (20px ≥481px) */
  --card-pad: 16px;      /* (20px ≥481px) */
  --card-gap: 12px;      /* between stacked cards */
  --section-gap: 28px;   /* above a section label */
  --page-max: 640px;
  --tap: 44px;           /* minimum hit target */

  /* ---- Radii (5 values; replaces 13 in gym alone) ---- */
  --radius-xs: 6px;      /* tiny inner marks only */
  --radius-sm: 8px;      /* tiles, tags-in-rows, chart corners */
  --radius-md: 12px;     /* fields, segmented control, inset groups, toast, large checkbox */
  --radius-lg: 18px;     /* cards, grouped lists */
  --radius-xl: 26px;     /* bottom-sheet top corners */
  --radius-pill: 999px;  /* buttons, chips, tags, bars */

  /* ---- Elevation (no glows anywhere) ---- */
  --shadow-card: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 8px 24px rgba(0, 0, 0, 0.35);
  --shadow-raised: 0 -1px 0 rgba(255, 255, 255, 0.06), 0 24px 64px rgba(0, 0, 0, 0.60);
  --shadow-porcelain: inset 0 1px 0 rgba(255, 255, 255, 0.70), 0 1px 2px rgba(0, 0, 0, 0.40), 0 6px 16px rgba(0, 0, 0, 0.30);
  --blur-material: saturate(1.6) blur(20px);  /* chrome, sheets' scrim-free bars, toasts only */

  /* ---- Motion ---- */
  --dur-instant: 100ms;   /* press scale */
  --dur-fast: 160ms;      /* colour/background changes */
  --dur-base: 240ms;      /* toggles, fades, check pop, ticker crossfade */
  --dur-slow: 360ms;      /* sheets, overlays */
  --dur-progress: 600ms;  /* bar/ring fills */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);  /* checkmark pop only */

  /* ---- Layout & layers ---- */
  --topbar-h: 52px;  --tabbar-h: 56px;
  --z-chrome: 40; --z-session: 80; --z-sheet: 100; --z-viewer: 200; --z-toast: 250; --z-camera: 300;

  /* ================= Legacy aliases =================
     So existing rules adopt the system without renaming. */
  --text-primary: var(--text-1);  --text-secondary: var(--text-2);
  --text-tertiary: var(--text-3); --text-quaternary: var(--text-4);
  --success: var(--positive); --danger: var(--negative);
  --good: var(--positive); --warn: var(--warning); --bad: var(--negative); --info: var(--hue-health);
  --bg-deep: var(--bg);
  --bg-card: #111113;  /* opaque on purpose: gym/po-water also paint MODALS with --bg-card; visually = surface-1 on --bg */
  --bg-secondary: var(--surface-2); --bg-input: var(--surface-2); --bg-input-focus: var(--surface-2);
  --bg-dropdown: var(--bg-elevated);
  --card: var(--surface-1); --field: var(--surface-2); --hair: var(--border); --border-soft: var(--hairline);
  --glass-bg: var(--surface-1); --glass-border: transparent; --glass-border-strong: transparent;
  --glass-shadow: var(--shadow-card);
  --kcal: var(--hue-food);
  --warning-bg: var(--warning-tint); --tag-stack: var(--warning); --tag-stack-bg: var(--warning-tint);
  --accent-glow: transparent;
  /* finance --radius-sm (8) / --radius-md (12) map 1:1; finance --radius-lg 16 → 18 */
}
@media (min-width: 481px) { :root { --gutter: 20px; --card-pad: 20px; } }
@media (max-width: 360px) { :root { --fs-title-1: 26px; --fs-hero: 44px; } }
@media (prefers-reduced-motion: reduce) {
  :root { --dur-instant: 0ms; --dur-fast: 0ms; --dur-base: 0ms; --dur-slow: 0ms; --dur-progress: 0ms; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important; scroll-behavior: auto !important;
  }
}
/* ===================== /row-tokens v1 ===================== */
/* Food accent: porcelain. Macro hues (--protein/--carbs/--fat) are data colours, used only as dots, bars and rings. */
:root {
  --accent: var(--hue-food);
  --accent-ink: #0A0A0B;
  --accent-tint: rgba(244, 241, 234, 0.12);
  --accent-ring: rgba(244, 241, 234, 0.60);
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--text-2);
  font: var(--fw-regular) var(--fs-body)/var(--lh-body) var(--font); letter-spacing: var(--tracking-body);
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
/* No body padding: topbar.js puts its full-bleed sticky bar first in <body> and reserves the tab bar with
   body.has-bottombar; the gutter (and safe-area sides) live on .page. */
body { min-height: 100vh; min-height: 100dvh; position: relative; overflow-x: hidden; }
body.sheet-open { overflow: hidden; }
button { font-family: inherit; color: inherit; }
a, button, input, select, textarea, label, [role="button"] { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
input, select, textarea { font-size: var(--fs-input); }
:focus-visible { outline: 2px solid var(--accent-ring); outline-offset: 2px; }
::selection { background: var(--accent-tint); color: var(--text-1); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.row-ic { display: block; flex-shrink: 0; width: 20px; height: 20px; }
.row-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.page {
  max-width: var(--page-max); margin: 0 auto;
  padding: var(--space-3) calc(var(--gutter) + env(safe-area-inset-right)) var(--space-8) calc(var(--gutter) + env(safe-area-inset-left));
}
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-3); margin: var(--space-2) 0 var(--space-4); }
.page-title { margin: 0; font: var(--fw-bold) var(--fs-title-1)/1.1 var(--font-display); letter-spacing: var(--tracking-title); color: var(--text-1); }
.page-sub { margin-top: var(--space-1); font: var(--fw-medium) var(--fs-footnote)/1.3 var(--font-mono); color: var(--text-3); }
.head-actions { display: flex; gap: var(--space-2); align-items: center; }
.head-actions .btn { position: relative; }
.head-actions .btn::after { content: ''; position: absolute; inset: -4px 0; }

/* ---------- Cards, lists, labels ---------- */
.card { position: relative; margin: 0 0 var(--card-gap); padding: var(--card-pad); border: 0; border-radius: var(--radius-lg); background: var(--surface-1); box-shadow: var(--shadow-card); }
.card--hero { padding: var(--space-5); }
.list { margin: 0 0 var(--card-gap); border-radius: var(--radius-lg); background: var(--surface-1); box-shadow: var(--shadow-card); overflow: hidden; }
.eyebrow { display: block; margin: 0 0 var(--space-2); font: var(--fw-semibold) var(--fs-micro)/1.2 var(--font); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-3); }
.eyebrow.is-over { color: var(--negative); }
.section-label { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); margin: var(--section-gap) var(--space-1) var(--space-2); font: var(--fw-semibold) var(--fs-micro)/1.2 var(--font); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-3); }
.meta { font: var(--fw-regular) var(--fs-caption)/1.3 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-2); }
.meta.is-over { color: var(--negative); }
.group-label { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); margin: 0 var(--space-1); font: var(--fw-semibold) var(--fs-micro)/1.2 var(--font); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-3); }
.group-label .meta { font: var(--fw-medium) var(--fs-caption)/1 var(--font-mono); letter-spacing: 0; text-transform: none; color: var(--text-3); }
.hair { height: 1px; margin: var(--space-4) 0; background: var(--hairline); }
.row-stack { display: flex; flex-direction: column; gap: var(--space-4); }
.row-group { display: flex; flex-direction: column; gap: var(--space-2); }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: var(--tap); padding: 0 var(--space-5); border: 0; border-radius: var(--radius-pill); font: var(--fw-semibold) var(--fs-body)/1 var(--font); letter-spacing: 0; text-transform: none; white-space: nowrap; cursor: pointer; transition: transform var(--dur-instant) var(--ease-out), background-color var(--dur-fast) var(--ease-out), opacity var(--dur-fast); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; pointer-events: none; }
.btn .row-ic { width: 18px; height: 18px; stroke-width: 2; }
.btn--primary { background: var(--porcelain-fill); color: var(--text-on-light); font-weight: var(--fw-bold); box-shadow: var(--shadow-porcelain); }
.btn--secondary { background: var(--surface-3); color: var(--text-1); }
.btn--accent { background: var(--accent-tint); color: var(--accent); }
.btn--block { width: 100%; }
.btn--lg { min-height: 52px; padding: 0 var(--space-6); font-size: var(--fs-headline); }
.btn--sm { min-height: 36px; padding: 0 14px; font-size: var(--fs-footnote); }
.btn--sm .row-ic { width: 16px; height: 16px; }
.icon-btn { position: relative; display: inline-grid; place-items: center; flex-shrink: 0; width: var(--tap); height: var(--tap); padding: 0; border: 0; border-radius: var(--radius-pill); background: var(--surface-2); color: var(--text-2); cursor: pointer; transition: background-color var(--dur-fast), transform var(--dur-instant) var(--ease-out); }
.icon-btn:active { transform: scale(0.94); background: var(--surface-3); }
.icon-btn--plain { background: transparent; color: var(--text-3); }
.icon-btn[aria-pressed="true"] { color: var(--accent); }
.icon-btn.row-danger { color: var(--negative); }
/* Round "+" (meal add, quick add, portion stepper). */
.circle { display: grid; place-items: center; flex-shrink: 0; width: var(--tap); height: var(--tap); padding: 0; border: 0; border-radius: 50%; background: var(--surface-2); color: var(--text-1); cursor: pointer; transition: background-color var(--dur-fast), transform var(--dur-instant) var(--ease-out); }
.circle:active { transform: scale(0.94); background: var(--surface-3); }
.circle.done { background: var(--accent-tint); color: var(--accent); }

/* ---------- Week strip ---------- */
/* The arrows reach 12px into the page gutter so they get full 44px targets without shrinking the day cells. */
.week { display: flex; align-items: center; margin: 0 -12px var(--space-4); touch-action: pan-y; }
.week-arrow { display: grid; place-items: center; flex-shrink: 0; width: var(--tap); height: var(--tap); padding: 0; border: 0; border-radius: var(--radius-pill); background: none; color: var(--text-3); cursor: pointer; transition: background-color var(--dur-fast); }
.week-arrow:active { background: var(--surface-2); }
.week-cells { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.wcell { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; padding: 6px 0 8px; border: 0; border-radius: var(--radius-md); background: none; cursor: pointer; transition: background-color var(--dur-fast); }
.wcell.sel { background: var(--surface-2); }
.wcell .dow { font: var(--fw-semibold) var(--fs-micro)/1 var(--font); color: var(--text-3); }
.wcell.sel .dow, .wcell.today .dow { color: var(--text-1); }
.wring { position: relative; display: block; width: min(36px, 100%); aspect-ratio: 1; }
.wring svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
.wring .t { fill: none; stroke: var(--track); stroke-width: 3; }
.wring .p { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset var(--dur-progress) var(--ease-out); }
.wring .p.over { stroke: var(--negative); }
.wring .p.zero { stroke: none; }
.wring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: var(--fw-semibold) var(--fs-caption)/1 var(--font-mono); color: var(--text-2); }
.wcell.sel .wring span { color: var(--text-1); }
.wcell.future .wring span { color: var(--text-3); }
.wcell::after { content: ''; width: 4px; height: 4px; border-radius: 50%; background: transparent; }
.wcell.today::after { background: var(--accent); }

/* ---------- Hero ---------- */
.big { display: inline-flex; align-items: baseline; margin-top: var(--space-1); padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
.big .n { font: var(--fw-bold) var(--fs-hero)/var(--lh-tight) var(--font-display); letter-spacing: var(--tracking-hero); font-variant-numeric: tabular-nums; color: var(--text-1); }
.big .u { margin-left: 6px; font: var(--fw-medium) var(--fs-body)/1 var(--font); letter-spacing: 0; color: var(--text-3); }
.bar { position: relative; height: 6px; border-radius: var(--radius-pill); background: var(--track); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width var(--dur-progress) var(--ease-out); }
.bar--lg { height: 10px; }
.bar--thin { height: 4px; }
.bar.over > i { background: var(--negative); }
.hero .bar--lg { margin: var(--space-4) 0 var(--space-2); }
.macros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }
.mac .lab { display: flex; align-items: center; gap: 6px; font: var(--fw-semibold) var(--fs-micro)/1.2 var(--font); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--text-3); }
.mac .dot { width: 6px; height: 6px; flex-shrink: 0; border-radius: 50%; }
.mac .val { margin-top: var(--space-1); font: var(--fw-semibold) var(--fs-headline)/1.2 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-1); white-space: nowrap; }
.mac .val small { margin-left: 3px; font: var(--fw-medium) var(--fs-caption) var(--font); color: var(--text-3); }
.mac .bar { margin-top: var(--space-2); }

/* ---------- Meals ---------- */
.meal + .meal { box-shadow: inset 0 1px 0 var(--hairline); }
.meal-head { display: flex; align-items: center; gap: var(--space-1); padding-right: var(--space-2); }
.meal-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--space-3); min-height: 64px; padding: 10px 0 10px var(--space-4); border: 0; background: none; text-align: left; cursor: pointer; }
.meal-main > span:last-child { flex: 1; min-width: 0; }
.row-tile { display: grid; place-items: center; flex-shrink: 0; width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--surface-2); color: var(--text-2); }
.row-tile .row-ic { width: 18px; height: 18px; }
.meal-name { display: block; font: var(--fw-semibold) var(--fs-headline)/1.25 var(--font); color: var(--text-1); }
/* Compact "578 kcal · P 39 C 89 F 13"; on a narrow phone it wraps a token to a second line rather than hiding fat. */
.meal-sub { display: block; margin-top: 2px; font: var(--fw-regular) var(--fs-caption)/1.3 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-3); }
.meal-sub.has { color: var(--text-2); }
/* Entries indent 60px (16 padding + 32 tile + 12 gap) so their names sit under the meal names. */
.entry { position: relative; display: flex; align-items: center; gap: var(--space-3); width: 100%; min-height: 56px; padding: 10px var(--space-4) 10px 60px; border: 0; background: none; text-align: left; cursor: pointer; transition: background-color var(--dur-fast); }
.entry::before { content: ''; position: absolute; top: 0; left: 60px; right: 0; height: 1px; background: var(--hairline); }
.entry:active { background: var(--surface-2); }
.entry .l { flex: 1; min-width: 0; }
.entry .nm { display: block; font: var(--fw-medium) var(--fs-body)/1.3 var(--font); color: var(--text-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.f-title { padding: 0 var(--space-1); font: var(--fw-bold) var(--fs-title-2)/1.2 var(--font-display); letter-spacing: var(--tracking-title); color: var(--text-1); overflow-wrap: anywhere; }

.row-portion-help { padding: 0 var(--space-1); font: var(--fw-regular) var(--fs-caption)/1.4 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-3); }

      return '<div class="mac"><div class="lab"><span class="dot" style="background:' + color + '"></span>' + label + '</div>'
        + '<div class="val">' + n0(shown) + '<small>' + unit + '</small></div>'
        + '<div class="bar bar--thin">' + fill(key, Math.min(100, t > 0 ? v / t * 100 : 0), color) + '</div></div>';
    };

    const meals = MEALS.map(m => {
      const items = es.filter(e => e.meal === m.id), t = sum(items), src = sources[m.id];
      const srcLabel = src ? (Day.diff(d, src.date) === 1 ? 'yesterday' : Day.DOW[Day.dow(src.date)].slice(0, 3)) : '';
      return '<div class="meal"><div class="meal-head">'
        + '<button type="button" class="meal-main" data-act="add" data-meal="' + m.id + '"><span class="row-tile">' + svg(m.icon) + '</span><span><span class="meal-name">' + m.label + '</span>'
        + (items.length ? '<span class="meal-sub has">' + n0(t.kcal) + '\u00a0kcal\u00a0· ' + pcfNb(t) + '</span>' : '<span class="meal-sub">Nothing yet</span>') + '</span></button>'
        + ((items.length >= 2 || src) ? '<button type="button" class="icon-btn icon-btn--plain" data-act="meal-menu" data-meal="' + m.id + '" aria-label="' + m.label + ' options">' + svg('more', true) + '</button>' : '')
        + '<button type="button" class="circle" data-act="add" data-meal="' + m.id + '" aria-label="Add food to ' + m.label + '">' + svg('plus') + '</button></div>'
        + items.map(e => { const n = nut(e), pg = Math.round(n.p);
            return '<button type="button" class="entry' + (V.fresh.has(e.id) ? ' is-new' : '') + '" data-act="edit" data-id="' + e.id + '"><span class="l"><span class="nm">' + esc(e.name) + '</span><span class="am">' + esc(amtText(e)) + (pg > 0 ? ' · P ' + pg : '') + '</span></span><span class="kc">' + n0(n.kcal) + '<small>kcal</small></span></button>'; }).join('')
        + (!items.length && offer === m.id && src ? '<div class="copy-row"><button type="button" class="btn btn--sm btn--accent" data-act="copy" data-meal="' + m.id + '">' + svg('repeat') + 'Same as ' + srcLabel + '</button><span class="row-meta">' + n0(sum(src.items).kcal) + ' kcal</span></div>' : '')
        + '</div>';
    }).join('');

    $('#app').innerHTML =
      '<div class="page-head"><div><h1 class="page-title">Food</h1><div class="page-sub">' + esc(Day.long(d)) + '</div></div>'
      + '<div class="head-actions">' + (d !== today ? '<button type="button" class="btn btn--sm btn--secondary" data-act="today">Today</button>' : '')
      + '<button type="button" class="icon-btn" data-act="targets" aria-label="Daily targets">' + svg('target') + '</button></div></div>'
      + '<div class="week"><button type="button" class="week-arrow" data-act="week" data-n="-7" aria-label="Previous week">' + svg('chevL') + '</button><div class="week-cells" id="weekCells">' + cells + '</div><button type="button" class="week-arrow" data-act="week" data-n="7" aria-label="Next week">' + svg('chevR') + '</button></div>'
      + '<div class="card card--hero hero"><span class="eyebrow' + (over && left ? ' is-over' : '') + '">' + headTxt + '</span>'
      + '<button type="button" class="big" data-act="mode"><span class="n">' + n0(bigVal) + '</span><span class="u">kcal</span><span class="row-sr"> ' + headTxt.toLowerCase() + '. Tap to show calories ' + (left ? 'eaten' : 'left') + '.</span></button>'
      + '<div class="bar bar--lg' + (over ? ' over' : '') + '">' + fill('kcal', Math.min(100, frac * 100)) + '</div>'
      + '<div class="meta' + (over && !left ? ' is-over' : '') + '">' + meta + '</div><div class="hair"></div>'
      + '<div class="macros">' + macro('Protein', 'p', 'var(--protein)') + macro('Carbs', 'c', 'var(--carbs)') + macro('Fat', 'f', 'var(--fat)') + '</div></div>'
      + '<div class="section-label">Meals</div><div class="list meals">' + meals + '</div>';
    animateFills();
    // New rows keep their highlight until the sheet they were added from has closed.
    if (!sheets.length) V.fresh.clear();

    // swipe to page weeks
    const wk = $('#weekCells'); let sx = 0, sy = 0;
    wk.ontouchstart = e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; };
    wk.ontouchend = e => { const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 2) { V.date = Day.add(V.date, dx < 0 ? 7 : -7); render(); } };
  }

  function refresh() { render(); const top = sheets[sheets.length - 1]; if (top && top._refresh) top._refresh(); }

  $('#app').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act;
    if (a === 'day') { V.date = b.dataset.d; render(); }
    else if (a === 'week') { V.date = Day.add(V.date, Number(b.dataset.n)); render(); }
    else if (a === 'today') { V.date = Day.today(); render(); }
    else if (a === 'mode') { S.mode = S.mode === 'left' ? 'eaten' : 'left'; save(); render(); }
    else if (a === 'targets') openTargets();
    else if (a === 'add') openAdd(b.dataset.meal, V.date);
    else if (a === 'edit') { const en = S.entries.find(x => x.id === b.dataset.id); if (en) openFood({ food: entryFood(en), meal: en.meal, date: en.date, editId: en.id, amount: en.amount }); }
    else if (a === 'copy') { const m = b.dataset.meal; copyMeal(m, sourcesFor(m)); }
    else if (a === 'meal-menu') openMealMenu(b.dataset.meal);
  });

  function sourcesFor(mealId) {
    const d = V.date, from = Day.add(d, -3);
    const mine = S.entries.filter(e => e.date < d && e.date >= from && e.meal === mealId);
    if (!mine.length) return null;
    const latest = mine.map(e => e.date).sort().pop();
    return { date: latest, items: mine.filter(e => e.date === latest) };
  }
  function copyMeal(mealId, src) {
    if (!src || !src.items.length) return;
    const label = Day.diff(V.date, src.date) === 1 ? 'yesterday' : Day.DOW[Day.dow(src.date)].slice(0, 3);
    const fresh = src.items.map(it => Object.assign(clone(it), { id: uid(), date: V.date, meal: mealId, ts: Date.now() / 1000 }));
    const ids = new Set(fresh.map(x => x.id));
    S.entries.push(...fresh); ids.forEach(id => V.fresh.add(id)); save(); render();
    toast('Copied ' + mealLabel(mealId) + ' from ' + label + ' · ' + fresh.length + ' items', () => { S.entries = S.entries.filter(x => !ids.has(x.id)); });
  }

  // ---------- sheet stack ----------
  const sheets = [];
  function openSheet(title, o) {
    o = o || {};
    const prev = sheets[sheets.length - 1]; if (prev) prev.classList.add('under');
    const el = document.createElement('div'); el.className = 'sheet-overlay';
    // o.sub: a pinned strip between the head and the scrolling body. o.tall: fixed full height.
    el.innerHTML = '<div class="sheet' + (o.tall ? ' row-sheet-tall' : '') + (o.footer ? '' : ' row-no-foot') + '" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="sheet-grab"></div>'
      + '<div class="sheet-head"><div class="sheet-x"><button type="button" data-close aria-label="Close"><span>' + svg('x') + '</span></button></div><h2>' + esc(title) + '</h2><div class="sheet-right">' + (o.headRight || '') + '</div></div>'
      + (o.sub ? '<div class="row-sheet-sub">' + o.sub + '</div>' : '')
      + '<div class="sheet-body">' + (o.body || '') + '</div><div class="sheet-foot">' + (o.footer || '') + '</div></div>';
    el.addEventListener('click', e => { if (e.target === el || e.target.closest('[data-close]')) closeSheet(); });
    // Swipe down on the grab handle or title closes, as the handle promises. Not from fields or buttons.
    const sh = el.querySelector('.sheet'); let y0 = null;
    sh.addEventListener('touchstart', e => { y0 = e.target.closest('.sheet-grab, .sheet-head h2') ? e.touches[0].clientY : null; }, { passive: true });
    sh.addEventListener('touchend', e => { if (y0 != null && e.changedTouches[0].clientY - y0 > 70 && sheets[sheets.length - 1] === el) closeSheet(); y0 = null; });
    document.body.appendChild(el); document.body.classList.add('sheet-open');
    requestAnimationFrame(() => { placeToast(); requestAnimationFrame(() => { if (!el.classList.contains('out')) el.classList.add('in'); }); });
    sheets.push(el); return el;
  }
  function closeSheet() {
    const el = sheets.pop(); if (!el) return;
    // Slide out, then remove. Ids go now, so the global #addList/#addFoot/#addTabs lookups can only ever
    // find the live sheet, even if a new Add sheet opens while this one is still animating away.
    el.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
    el.classList.remove('in', 'under'); el.classList.add('out');
    setTimeout(() => el.remove(), matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 360);
    const top = sheets[sheets.length - 1];
    if (top) top.classList.remove('under'); else document.body.classList.remove('sheet-open');
    render(); if (top && top._refresh) top._refresh();
    placeToast();
  }
  function closeAll() { while (sheets.length) closeSheet(); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheets.length) closeSheet(); });

  // ---------- targets ----------
  function openTargets() {
    const t = S.targets;
    const row = (id, color, label, unit, v) => '<div class="frow"><label for="' + id + '"><span class="dot" style="background:' + color + '"></span>' + label + '</label><input id="' + id + '" inputmode="numeric" value="' + v + '"><span class="unit">' + unit + '</span></div>';
    const el = openSheet('Daily targets', {
      body: '<div class="form-card">' + row('tk', 'var(--kcal)', 'Calories', 'kcal', t.kcal) + row('tp', 'var(--protein)', 'Protein', 'g', t.p) + row('tc', 'var(--carbs)', 'Carbohydrate', 'g', t.c) + row('tf', 'var(--fat)', 'Fat', 'g', t.f) + '</div><div class="field-help mono" id="tcheck"></div>',
      footer: '<button type="button" class="btn btn--primary btn--block btn--lg" id="tsave">Save targets</button>'
    });
    const chk = () => {
      const k = num($('#tk', el).value), m = (num($('#tp', el).value) || 0) * 4 + (num($('#tc', el).value) || 0) * 4 + (num($('#tf', el).value) || 0) * 9;
      const tc = $('#tcheck', el);
      tc.textContent = !(k > 0) ? 'Enter a calorie target.' : 'P×4 + C×4 + F×9 = ' + n0(m) + ' kcal · ' + (Math.abs(m - k) < 1 ? 'matches' : n0(Math.abs(m - k)) + (m < k ? ' under' : ' over'));
      tc.classList.toggle('is-warn', !(k > 0) || Math.abs(m - k) > Math.max(50, k * 0.03));
    };
    el.addEventListener('input', chk); chk();
    $('#tsave', el).onclick = () => {
      const v = ['#tk', '#tp', '#tc', '#tf'].map(s => num($(s, el).value));
      if (!v.every(x => x != null && x >= 0) || !(v[0] > 0)) return toast('Enter all four targets as numbers');
      S.targets = { kcal: Math.round(v[0]), p: Math.round(v[1]), c: Math.round(v[2]), f: Math.round(v[3]) };
      save(); closeSheet(); toast('Targets saved');
    };
  }

  // ---------- meal menu / save meal ----------
  function openMealMenu(mealId) {
    const items = S.entries.filter(e => e.date === V.date && e.meal === mealId), src = sourcesFor(mealId);
    const label = src ? (Day.diff(V.date, src.date) === 1 ? 'yesterday' : Day.DOW[Day.dow(src.date)].slice(0, 3)) : '';
    const el = openSheet(mealLabel(mealId), {
      body: '<div class="menu-list">' + (items.length >= 2 ? '<button type="button" data-m="save">' + svg('bookmark') + 'Save as meal</button>' : '') + (src ? '<button type="button" data-m="copy">' + svg('repeat') + 'Copy from ' + label + '</button>' : '') + '</div>'
    });
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-m]'); if (!b) return;
      if (b.dataset.m === 'save') { closeSheet(); openSaveMeal(items); }
      else { closeSheet(); copyMeal(mealId, src); }
    });
  }
  function openSaveMeal(items) {
    const t = sum(items);
    const el = openSheet('Save as meal', {
      body: '<input class="field" id="mname" placeholder="Meal name" aria-label="Meal name" maxlength="60" enterkeyhint="done"><div class="field-help mono">' + items.length + ' items · ' + n0(t.kcal) + ' kcal · ' + pcf(t) + '</div>',
      footer: '<button type="button" class="btn btn--primary btn--block btn--lg" id="msave">Save meal</button>'
    });
    $('#mname', el).focus();
    $('#mname', el).onkeydown = e => { if (e.key === 'Enter') $('#msave', el).click(); };
    $('#msave', el).onclick = () => {
      const name = $('#mname', el).value.trim(); if (!name) return toast('Name the meal first');
      S.meals.unshift({ id: uid(), name, items: items.map(e => ({ name: e.name, base: e.base, baseAmt: e.baseAmt, unit: e.unit, servings: e.servings || [], servingLabel: e.servingLabel, servingGrams: e.servingGrams, amount: e.amount })) });
      save(); closeSheet(); toast('Meal saved · reuse it from Add food → Meals');
    };
  }

  // ---------- add food sheet ----------
  let A = null;      // current add context
  let regKey = 0, REG = {};
  function entryFood(e) { return { id: uid(), name: e.name, base: e.base, baseAmt: e.baseAmt, unit: e.unit, servings: e.servings || [], servingLabel: e.servingLabel, servingGrams: e.servingGrams, barcode: e.barcode }; }
  function savedFoods() { return S.foods; }
  // Same product: same barcode, or same name as shown (OFF names leave the brand out, so the bare name isn't enough).
  const sameFood = (a, b) => !!(a.barcode && a.barcode === b.barcode) || displayName(a) === displayName(b);
  const isSaved = food => S.foods.some(f => sameFood(f, food));

  function frequent() {
    const from = Day.add(Day.today(), -14), by = {};
    for (const e of S.entries) if (e.date >= from) {
      const c = by[e.name];
      if (!c) by[e.name] = { n: 1, e }; else { c.n++; if ((e.date + e.ts) > (c.e.date + c.e.ts)) c.e = e; }
    }
    return Object.values(by).sort((a, b) => b.n - a.n || (b.e.date + b.e.ts < a.e.date + a.e.ts ? -1 : 1)).map(x => x.e);
  }

  function openAdd(meal, date, tab, prefill) {
    A = { meal: meal || defMeal(), date: date || V.date, tab: tab || 'search', q: '', online: [], ostate: 'idle', recent: frequent(), added: {}, man: Object.assign({ name: '', per100: false, serving: '', servingG: '', kcal: '', p: '', c: '', f: '', barcode: '', save: true }, prefill || {}) };
    const mealSel = '<select class="sel-pill" id="addMeal" aria-label="Meal">' + MEALS.map(m => '<option value="' + m.id + '"' + (m.id === A.meal ? ' selected' : '') + '>' + m.label + '</option>').join('') + '</select>';
    // Search and tabs are pinned above the scrolling list, and the sheet keeps one height.
    const el = openSheet(A.date === Day.today() ? 'Add food' : Day.fmt(A.date), {
      headRight: mealSel, tall: true,
      sub: '<div class="search">' + svg('search') + '<input class="field" id="addQ" type="search" enterkeyhint="search" placeholder="Search foods and brands" aria-label="Search foods" autocomplete="off">'
        + '<button type="button" class="icon-btn icon-btn--plain row-scan" id="scBarcode" aria-label="Look up a barcode">' + svg('barcode') + '</button></div>'
        + '<div class="seg" id="addTabs"></div>',
      body: '<div id="addList" class="row-stack"></div>',
      footer: '<div id="addFoot"></div>'
    });
    // The manual form doesn't depend on S, and rebuilding it would drop the field being typed in.
    el._refresh = () => { const sel = el.querySelector('.sel-pill'); if (sel) sel.value = A.meal; if (A.tab !== 'manual') { renderAddList(); renderAddFoot(); } };
    const toTop = () => { const sb = el.querySelector('.sheet-body'); if (sb) sb.scrollTop = 0; };
    $('#addMeal', el).onchange = e => { A.meal = e.target.value; };
    $('#addQ', el).oninput = e => { A.q = e.target.value; if (A.tab !== 'search') { A.tab = 'search'; renderAddFoot(); } scheduleOnline(); renderTabs(); renderAddList(); toTop(); };
    $('#addQ', el).onkeydown = e => { if (e.key === 'Enter') e.target.blur(); };
    $('#scBarcode', el).onclick = openBarcode;
    $('#addTabs', el).onclick = e => { const b = e.target.closest('button'); if (!b) return; A.tab = b.dataset.t; renderTabs(); renderAddList(); renderAddFoot(); toTop(); };
    $('#addList', el).onclick = onAddListClick;
    renderTabs(); renderAddList(); renderAddFoot();
    if (A.tab !== 'manual') setTimeout(() => { try { if (sheets[sheets.length - 1] === el) $('#addQ', el).focus({ preventScroll: true }); } catch (e) {} }, 380);
  }
  function renderTabs() {
    $('#addTabs').innerHTML = [['search', 'Search'], ['saved', 'Saved'], ['meals', 'Meals'], ['manual', 'Manual']].map(t => '<button type="button" data-t="' + t[0] + '" class="' + (A.tab === t[0] ? 'on' : '') + '" aria-pressed="' + (A.tab === t[0]) + '">' + t[1] + '</button>').join('');
  }
  function renderAddFoot() {
    const f = $('#addFoot'); if (!f) return;
    if (A.tab === 'manual') { f.innerHTML = '<button type="button" class="btn btn--primary btn--block btn--lg" id="manGo">Choose amount</button>'; $('#manGo').onclick = manualGo; return; }
    const tg = S.targets, t = eaten(A.date), left = tg.kcal - t.kcal;
    const ml = { p: Math.max(0, tg.p - t.p), c: Math.max(0, tg.c - t.c), f: Math.max(0, tg.f - t.f) };
    f.innerHTML = '<div class="plate"><div><div class="l' + (left < 0 ? ' is-over' : '') + '">' + (left < 0 ? 'Over' : 'Left') + (A.date === Day.today() ? ' today' : ' · ' + Day.fmt(A.date)) + '</div><div class="v">' + n0(Math.abs(left)) + '<small>kcal</small></div></div>'
      + '<div class="m">' + pcf(ml) + '</div><button type="button" class="btn btn--secondary" id="addDone">Done</button></div>';
    $('#addDone').onclick = closeAll;
  }

  let onlineTimer, onlineSeq = 0;
  function scheduleOnline() {
    clearTimeout(onlineTimer);
    const q = A.q.trim();
    // Bump the sequence here too, so a request already in flight can't fill in results for the old query.
    if (A.tab !== 'search' || q.length < 2) { onlineSeq++; A.online = []; A.ostate = 'idle'; return; }
    A.ostate = 'loading';   // the caller renders the list next
    const seq = ++onlineSeq;
    onlineTimer = setTimeout(async () => {
      try { const r = await offSearch(q); if (seq !== onlineSeq || !A) return; A.online = r; A.ostate = 'done'; }
      catch (e) { if (seq !== onlineSeq || !A) return; A.online = []; A.ostate = 'failed'; }
      renderAddList();
    }, 400);
  }

  function reg(x) { const k = 'k' + (++regKey); REG[k] = x; return k; }
  function foodRow(fo) {
    const h = foodHead(fo);
    return rowHtml({ key: reg({ kind: 'food', food: fo }), name: displayName(fo), amount: h.amount, kcal: h.macros.kcal, macros: h.macros });
  }
  function recentRow(e) {
    const n = nut(e);
    return rowHtml({ key: reg({ kind: 'recent', entry: e }), name: e.name, amount: amtText(e), kcal: n.kcal, macros: n });
  }
  // Compact macros, "P 39 C 89 F 13", in unbreakable tokens: a narrow row wraps between tokens, never inside one.
  const pcfNb = n => ['p', 'c', 'f'].map(k => k.toUpperCase() + '\u00a0' + Math.round(n[k])).join(' ');
  const nb = t => String(t).replace(/ /g, '\u00a0');
  // One row: name, then "amount · P C F" (wraps to a second line before it truncates), kcal in its own column.
  function rowHtml(r) {
    const done = A.added[r.key];
    return '<div class="row"><button type="button" class="row-main" data-k="' + r.key + '" data-a="open"><span class="l"><span class="nm">' + esc(r.name) + '</span><span class="hd">' + esc(nb(r.amount) + (r.macros ? '\u00a0· ' + pcfNb(r.macros) : '')) + '</span></span><span class="kc">' + n0(r.kcal) + '<small>kcal</small></span></button>'
      + '<button type="button" class="circle' + (done ? ' done' : '') + '" data-k="' + r.key + '" data-a="quick" aria-label="Quick add ' + esc(r.name) + '">' + svg(done ? 'check' : 'plus') + '</button></div>';
  }

  function renderAddList() {
    const box = $('#addList'); if (!box) return;
    REG = {}; regKey = 0;
    const q = A.q.trim(), saved = savedFoods();
    let html = '';
    const group = (title, rowsHtml) => '<div class="row-group"><div class="group-label">' + title + '</div><div class="rows">' + rowsHtml + '</div></div>';
    const empty = (title, body, btn) => '<div class="empty"><div class="empty-title">' + title + '</div><div class="empty-body">' + body + '</div>' + (btn || '') + '</div>';
    if (A.tab === 'search') {
      let rows = [];
      if (q) {
        const ql = q.toLowerCase(), seen = new Set(), hits = [];
        const score = name => { const n = name.toLowerCase(); const s = n.startsWith(ql) ? 2 : n.includes(ql) ? 1.5 : match(q, name); return s >= 0.6 ? s : null; };
        for (const x of saved.concat(LIB)) { if (seen.has(x.name)) continue; const s = score(displayName(x)); if (s == null) continue; seen.add(x.name); hits.push([foodRow(x), s]); }
        for (const e of A.recent) { if (seen.has(e.name)) continue; const s = score(e.name); if (s == null) continue; seen.add(e.name); hits.push([recentRow(e), s]); }
        rows = hits.sort((a, b) => b[1] - a[1]).slice(0, 12).map(h => h[0]);
        if (rows.length) html += group('On this device', rows.join(''));
        const showOnline = A.ostate === 'loading' || A.online.length || (A.ostate === 'failed' && rows.length);
        if (showOnline) {
          html += '<div class="row-group"><div class="group-label">Open Food Facts' + (A.ostate === 'loading' ? '<span class="meta">Searching…</span>' : '') + '</div>'
            + (A.online.length ? '<div class="rows">' + A.online.map(foodRow).join('') + '</div>' : A.ostate === 'failed' ? '<div class="field-help">Couldn’t reach Open Food Facts. Foods on this device still work.</div>' : '') + '</div>';
        }
        if (!rows.length && !A.online.length && A.ostate !== 'loading') {
          html += empty('No match for “' + esc(q) + '”', A.ostate === 'failed' ? 'Nothing on this device, and Open Food Facts couldn’t be reached. Enter the values from the label.' : 'Check the spelling, or enter the values from the label.',
            '<button type="button" class="btn btn--secondary" data-a="manualFrom">Add manually</button>');
        }
      } else {
        rows = A.recent.slice(0, 8).map(recentRow);
        html += rows.length ? group('Frequent', rows.join('')) : group('Common foods', LIB.slice(0, 10).map(foodRow).join(''));
      }
    } else if (A.tab === 'saved') {
      html += saved.length ? group('Saved foods', saved.map(foodRow).join('')) : empty('No saved foods', 'Tap the star on any food to keep it here.');
    } else if (A.tab === 'meals') {
      html += S.meals.length ? '<div class="rows">' + S.meals.map(m => {
        const t = sum(m.items);
        return '<div class="row"><button type="button" class="row-main" data-meal-id="' + m.id + '" data-a="meal"><span class="l"><span class="nm">' + esc(m.name) + '</span><span class="hd">' + m.items.length + '\u00a0items\u00a0· ' + pcfNb(t) + '</span></span><span class="kc">' + n0(t.kcal) + '<small>kcal</small></span></button>'
          + '<button type="button" class="icon-btn icon-btn--plain" data-meal-id="' + m.id + '" data-a="meal-del" aria-label="Delete ' + esc(m.name) + '">' + svg('trash') + '</button>'
          + '<button type="button" class="circle" data-meal-id="' + m.id + '" data-a="meal" aria-label="Add ' + esc(m.name) + '">' + svg('plus') + '</button></div>';
      }).join('') + '</div>' : empty('No saved meals', 'Log two or more foods in a meal, then tap the more button next to it and choose Save as meal.');
    } else {
      html += manualForm();
    }
    box.innerHTML = html;
    if (A.tab === 'manual') wireManual();
  }

  function onAddListClick(e) {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a;
    if (a === 'open' || a === 'quick') {
      const r = REG[b.dataset.k]; if (!r) return;
      if (r.kind === 'food') { a === 'open' ? openFood({ food: r.food, meal: A.meal, date: A.date, amount: wfmt(defaultAmount(r.food)) }) : quickAdd(r.food, b.dataset.k); }
      else { a === 'open' ? openFood({ food: entryFood(r.entry), meal: A.meal, date: A.date, amount: r.entry.amount, portionFrom: r.entry }) : addRecent(r.entry, b.dataset.k); }
    } else if (a === 'meal') {
      const m = S.meals.find(x => x.id === b.dataset.mealId); if (!m) return;
      const fresh = m.items.map(it => Object.assign(clone(it), { id: uid(), date: A.date, meal: A.meal, ts: Date.now() / 1000 }));
      const ids = new Set(fresh.map(x => x.id)); S.entries.push(...fresh); ids.forEach(id => V.fresh.add(id)); save(); closeAll();
      toast('Added ' + m.name + ' · ' + fresh.length + ' items', () => { S.entries = S.entries.filter(x => !ids.has(x.id)); });
    } else if (a === 'meal-del') {
      const m = S.meals.find(x => x.id === b.dataset.mealId); if (!m || !confirm('Delete saved meal “' + m.name + '”?')) return;
      S.meals = S.meals.filter(x => x.id !== m.id); save(); renderAddList();
    } else if (a === 'manualFrom') { A.man.name = A.q.trim(); A.tab = 'manual'; renderTabs(); renderAddList(); renderAddFoot(); }
  }

  function logEntry(food, pick, meal, date) {
    const e = { id: uid(), date, meal, name: displayName(food), base: pick.base, baseAmt: pick.baseAmt, unit: pick.unit, servings: pick.servings || [], servingLabel: pick.servingLabel, barcode: food.barcode || null, amount: pick.amount, ts: Date.now() / 1000, servingGrams: pick.servingGrams };
    S.entries.push(e); V.fresh.add(e.id); return e;
  }
  function flashAdded(key) { A.added[key] = true; setTimeout(() => { if (A) { delete A.added[key]; if ($('#addList')) renderAddList(); } }, 1200); }
  function quickAdd(food, key) {
    const p = defaultPick(food); if (!p) return openFood({ food, meal: A.meal, date: A.date, amount: wfmt(defaultAmount(food)) });
    const e = logEntry(food, p, A.meal, A.date); save(); render(); renderAddList(); renderAddFoot(); flashAdded(key);
    toast('Added ' + food.name + ' · ' + amtText(e), () => { S.entries = S.entries.filter(x => x.id !== e.id); });
  }
  function addRecent(en, key) {
    const e = Object.assign(clone(en), { id: uid(), date: A.date, meal: A.meal, ts: Date.now() / 1000 });
    S.entries.push(e); V.fresh.add(e.id); save(); render(); renderAddList(); renderAddFoot(); flashAdded(key);
    toast('Added ' + e.name + ' · ' + amtText(e), () => { S.entries = S.entries.filter(x => x.id !== e.id); });
  }

  // ---------- manual form ----------
  function manualForm() {
    const m = A.man;
    const r = (id, label, v, ph, unit, wide, dot) => '<div class="frow"><label for="' + id + '">' + (dot ? '<span class="dot" style="background:' + dot + '"></span>' : '') + label + '</label><input id="' + id + '" ' + (wide ? 'class="wide" type="text"' : 'inputmode="decimal"') + ' placeholder="' + ph + '" value="' + esc(v) + '">' + (unit ? '<span class="unit">' + unit + '</span>' : '') + '</div>';
    return '<div class="form-card">' + r('mName', 'Name', m.name, 'Food name', '', true)
      + '<div class="frow"><label>Values are per</label><div class="seg row-seg-inline" id="mPer"><button type="button" data-v="0" class="' + (m.per100 ? '' : 'on') + '" aria-pressed="' + !m.per100 + '">Serving</button><button type="button" data-v="1" class="' + (m.per100 ? 'on' : '') + '" aria-pressed="' + m.per100 + '">100 g</button></div></div>'
      + r('mServing', m.per100 ? 'Serving label' : 'Serving', m.serving, '1 serving', '', true) + r('mServingG', 'Serving weight', m.servingG, 'optional', 'g')
      + r('mKcal', 'Calories', m.kcal, '0', 'kcal', false, 'var(--kcal)') + r('mP', 'Protein', m.p, '0', 'g', false, 'var(--protein)') + r('mC', 'Carbs', m.c, '0', 'g', false, 'var(--carbs)') + r('mF', 'Fat', m.f, '0', 'g', false, 'var(--fat)')
      + r('mBar', 'Barcode', m.barcode, 'optional', '', true)
      + '<div class="frow"><label for="mSave">Save to my foods</label><button type="button" class="switch' + (m.save ? ' on' : '') + '" id="mSave" role="switch" aria-checked="' + m.save + '"></button></div></div>';
  }
  function wireManual() {
    const m = A.man, bind = (id, k) => { const el = $('#' + id); if (el) el.oninput = e => { m[k] = e.target.value; }; };
    bind('mName', 'name'); bind('mServing', 'serving'); bind('mServingG', 'servingG'); bind('mKcal', 'kcal'); bind('mP', 'p'); bind('mC', 'c'); bind('mF', 'f'); bind('mBar', 'barcode');
    $('#mPer').onclick = e => { const b = e.target.closest('button'); if (!b) return; m.per100 = b.dataset.v === '1'; renderAddList(); };
    $('#mSave').onclick = () => { m.save = !m.save; $('#mSave').classList.toggle('on', m.save); $('#mSave').setAttribute('aria-checked', m.save); };
  }
  function manualGo() {
    const m = A.man, name = m.name.trim();
    if (!name) return toast('Add a name for this food');
    const k = num(m.kcal); if (k == null || k < 0) return toast('Enter calories (kcal)');
    const sg = num(m.servingG), sgOk = sg != null && sg > 0 ? sg : null;
    if (m.servingG.trim() && sgOk == null) return toast('Check the serving weight');
    const base = { kcal: k, p: num(m.p) || 0, c: num(m.c) || 0, f: num(m.f) || 0 };
    const sl = m.serving.trim() || '1 serving', bc = m.barcode.trim() || null;
    const food = m.per100
      ? { id: uid(), name, base, baseAmt: 100, unit: 'g', servings: sgOk ? [{ label: sl, grams: sgOk }] : [], barcode: bc }
      : { id: uid(), name, base, baseAmt: 1, unit: 'serving', servings: [], servingLabel: sl, servingGrams: sgOk, barcode: bc };
    // Saving a name (or barcode) that's already saved updates that food rather than keeping the old values.
    let was = -1;
    if (m.save) { was = S.foods.findIndex(f => sameFood(f, food)); if (was >= 0) { food.id = S.foods[was].id; S.foods[was] = food; } else S.foods.unshift(food); save(); }
    openFood({ food, meal: A.meal, date: A.date, amount: wfmt(defaultAmount(food)) });
    if (m.save) toast(was >= 0 ? 'Updated saved food' : 'Saved to my foods');
  }

  // ---------- barcode ----------
  function openBarcode() {
    const el = openSheet('Barcode', {
      body: '<input class="field field--num" id="bcIn" inputmode="numeric" placeholder="e.g. 5000159407236" aria-label="Barcode number" maxlength="14" autocomplete="off" enterkeyhint="search"><div class="field-help" id="bcMsg">Looks the product up on Open Food Facts.</div>',
      footer: '<button type="button" class="btn btn--primary btn--block btn--lg" id="bcGo">Look up</button>'
    });
    const inp = $('#bcIn', el), msg = $('#bcMsg', el), btn = $('#bcGo', el);
    inp.focus();
    const say = (text, err) => { msg.textContent = text; msg.classList.toggle('is-error', !!err); };
    const go = async () => {
      if (btn.disabled) return;
      const code = inp.value.replace(/\D/g, '');
      if (code.length < 8) return say('Enter the 8–14 digit number under the barcode.', true);
      say('Looking up…'); btn.disabled = true;
      try {
        const f = await offBarcode(code);
        if (sheets[sheets.length - 1] !== el) return;   // closed while looking up
        if (!f) {
          // Not a dead end: hand the typed code to the manual form.
          msg.innerHTML = 'Not on Open Food Facts. <button type="button" class="btn btn--sm btn--secondary">Add manually</button>'; msg.classList.add('is-error');
          $('button', msg).onclick = () => { closeSheet(); A.man.barcode = code; A.tab = 'manual'; renderTabs(); renderAddList(); renderAddFoot(); };
          return;
        }
        closeSheet(); openFood({ food: f, meal: A.meal, date: A.date, amount: wfmt(defaultAmount(f)) });
      } catch (e) { say('Couldn’t reach Open Food Facts. Check the connection and try again.', true); }
      finally { btn.disabled = false; }
    };
    btn.onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go(); };
  }

  // ---------- food sheet (portion + add/edit) ----------
  function openFood(init) {
    const F = { food: clone(init.food), meal: init.meal || defMeal(), date: init.date || V.date, editId: init.editId || null, amount: init.amount, inGrams: false, unitIdx: 0, weightText: '' };
    const fo = F.food, us = units(fo);
    F.inGrams = fo.unit === 'g';
    if (!F.inGrams && fo.servingLabel) { const i = us.findIndex(u => u.label === fo.servingLabel); if (i >= 0) F.unitIdx = i; }
    // Re-logging a "recent" entry that was in servings of a gram food: keep its portion.
    const askWeight = perGram(fo) == null;
    const editing = !!F.editId;
    const head = editing ? '<button type="button" class="icon-btn row-danger" data-x="del" aria-label="Delete entry">' + svg('trash') + '</button>'
      : '<button type="button" class="icon-btn" data-x="star" aria-label="Save food" aria-pressed="' + isSaved(fo) + '">' + svg('star', isSaved(fo)) + '</button>';
    const src = [fo.brand, fo.source === 'off' ? 'Open Food Facts' : null].filter(Boolean).join(' · ');
    const el = openSheet(editing ? 'Edit entry' : 'Add food', {
      headRight: head,
      body: '<div class="f-title">' + esc(fo.name) + '</div>' + (src ? '<div class="f-src">' + esc(src) + '</div>' : '')
        + '<div id="fNut"></div><div id="fPortion" class="row-group"></div><div id="fWeight"></div>'
        + '<div class="row-group"><div class="group-label">Meal</div><div class="seg" id="fMeal">' + MEALS.map(m => '<button type="button" data-m="' + m.id + '" class="' + (m.id === F.meal ? 'on' : '') + '" aria-pressed="' + (m.id === F.meal) + '">' + m.label + '</button>').join('') + '</div></div>',
      // The "After this" line sits right above the button, so every portion change shows its effect on the day.
      footer: '<div class="row-foot-proj" id="fProj"></div><button type="button" class="btn btn--primary btn--block btn--lg" id="fGo"></button>'
    });

    const cur = () => {
      const us2 = units(F.food), pg = perGram(F.food);
      const g = (F.inGrams && pg != null) || !us2.length, u = us2[F.unitIdx] || us2[0], a = num(F.amount);
      const pick = g ? pickGrams(F.food, a || 0) : (u ? pickUnit(F.food, u, a || 0) : null);
      return { us: us2, pg, g, u, a, pick, n: pick ? nut(pick) : ZERO };
    };
    const mringHtml = (lab, key, color, n) => {
      const t = S.targets[key], fr = t > 0 ? n[key] / t : 0, C = 2 * Math.PI * 17;
      // Ring = share of the daily target; the centre carries the grams.
      return '<div class="mring" role="img" aria-label="' + lab + ' ' + n0(n[key]) + ' g, ' + Math.round(fr * 100) + '% of daily target"><div class="r"><svg viewBox="0 0 40 40" aria-hidden="true"><circle class="t" cx="20" cy="20" r="17"/><circle class="p" cx="20" cy="20" r="17" stroke="' + color + '" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - Math.min(1, fr))).toFixed(1) + '"/></svg><span aria-hidden="true">' + n0(n[key]) + '<small>g</small></span></div><div class="nmz" aria-hidden="true">' + lab + '</div></div>';
    };
    const projection = n => {
      const orig = F.editId ? S.entries.find(x => x.id === F.editId) : null;
      const day = orig ? orig.date : F.date;
      let t = eaten(day); if (orig) t = add(t, scale(nut(orig), -1));
      const tg = S.targets, kl = tg.kcal - t.kcal - n.kcal, pl = tg.p - t.p - n.p;
      return { text: 'After this: ' + (kl >= 0 ? n0(kl) + ' kcal left' : n0(-kl) + ' kcal over') + ' · ' + (pl >= 0.5 ? n0(pl) + ' g protein left' : 'protein target met') + (day !== Day.today() ? ' · ' + Day.fmt(day) : ''), over: kl < 0 };
    };
    const quickAmounts = (g, us2) => {
      if (!g) return [0.5, 1, 1.5, 2].map(x => [wfmt(x) + ' ×', x]);
      const out = us2.filter(u => u.grams).map(u => [/ g$/.test(u.label) ? u.label : u.label + ' · ' + wfmt(u.grams) + ' g', u.grams]);
      if (!out.some(o => o[1] === 100)) out.push(['100 g', 100]);
      return out;
    };

    const paintDynamic = () => {
      const c = cur();
      $('#fNut', el).innerHTML = '<div class="nrow"><div class="kc">' + n0(c.n.kcal) + '<small>kcal</small></div><div class="mrings">' + mringHtml('Protein', 'p', 'var(--protein)', c.n) + mringHtml('Carbs', 'c', 'var(--carbs)', c.n) + mringHtml('Fat', 'f', 'var(--fat)', c.n) + '</div></div>';
      const pj = projection(c.n), fp = $('#fProj', el); fp.textContent = pj.text; fp.classList.toggle('is-over', pj.over);
      const go = $('#fGo', el); go.textContent = editing ? 'Save changes' : 'Add to ' + mealLabel(F.meal) + ' · ' + n0(c.n.kcal) + ' kcal';
      const eq = $('#fEq', el); if (eq) eq.textContent = (!c.g && c.u && c.u.grams && c.a > 0) ? '= ' + wfmt(Math.round(c.a * c.u.grams)) + ' g · ' : '';
      el.querySelectorAll('[data-qa]').forEach(b => { const on = c.a === Number(b.dataset.qa); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    };
    const paintPortion = () => {
      const c = cur(), chips = quickAmounts(c.g, c.us), step = c.g ? 10 : 0.5;
      const perM = c.g ? (c.pg ? scale(c.pg, 100) : null) : (c.u ? unitMacros(F.food, c.u) : null);
      const per = perM ? (c.g ? 'Per 100 g · ' : 'Per ' + (c.u ? c.u.label : 'serving') + ' · ') + n0(perM.kcal) + ' kcal · ' + pcf(perM) : '';
      $('#fPortion', el).innerHTML = '<div class="group-label">Portion</div>'
        + (c.pg && c.us.length ? '<div class="seg" id="fMode"><button type="button" data-g="1" class="' + (c.g ? 'on' : '') + '" aria-pressed="' + c.g + '">Grams</button><button type="button" data-g="0" class="' + (c.g ? '' : 'on') + '" aria-pressed="' + !c.g + '">Servings</button></div>' : '')
        + (!c.g && c.us.length > 1 ? '<div class="chips" id="fUnits">' + c.us.map((u, i) => '<button type="button" class="chip' + (i === F.unitIdx ? ' on' : '') + '" data-u="' + i + '" aria-pressed="' + (i === F.unitIdx) + '">' + esc(u.label + (u.grams && !/ g$/.test(u.label) ? ' · ' + wfmt(u.grams) + ' g' : '')) + '</button>').join('') + '</div>' : '')
        + '<div class="stepper"><button type="button" class="circle" data-step="' + -step + '" aria-label="Less">' + svg('minus') + '</button><label class="amt" for="fAmt"><input id="fAmt" inputmode="decimal" value="' + esc(F.amount) + '" aria-label="' + (c.g ? 'Amount in grams' : 'Number of servings') + '"><span>' + (c.g ? 'g' : '× ' + esc(c.u ? c.u.label : 'serving')) + '</span></label><button type="button" class="circle" data-step="' + step + '" aria-label="More">' + svg('plus') + '</button></div>'
        + '<div class="chips">' + chips.map(q => '<button type="button" class="chip" data-qa="' + q[1] + '" aria-pressed="false">' + esc(q[0]) + '</button>').join('') + '</div>'
        + '<div class="row-portion-help"><span id="fEq"></span>' + esc(per) + '</div>';
      const inp = $('#fAmt', el);
      inp.oninput = () => { F.amount = inp.value; paintDynamic(); };
    };
    const paintWeight = () => {
      const w = $('#fWeight', el); if (!askWeight) { w.innerHTML = ''; return; }
      const u = units(F.food)[0];
      w.innerHTML = '<div class="row-group"><div class="group-label">Log in grams</div><div class="form-card"><div class="frow"><label for="fW">1 ' + esc(u ? u.label.replace(/^1 /, '') : 'serving') + ' weighs</label><input id="fW" inputmode="decimal" placeholder="—" value="' + esc(F.weightText) + '"><span class="unit">g</span></div></div><div class="field-help">' + (F.food.servingGrams ? 'Now you can pick Grams under Portion.' : 'Add one serving’s weight to log it in grams too.') + '</div></div>';
      $('#fW', el).oninput = e => {
        F.weightText = e.target.value; const x = num(e.target.value); const had = !!F.food.servingGrams;
        F.food.servingGrams = x > 0 ? x : null;
        if (had !== !!F.food.servingGrams) { paintPortion(); paintWeight(); $('#fW', el).focus(); }
        paintDynamic();
      };
    };

    el.addEventListener('click', e => {
      const t = e.target;
      let b;
      if ((b = t.closest('[data-step]'))) { const a = num(F.amount) || 0; F.amount = wfmt(Math.max(0, a + Number(b.dataset.step))); $('#fAmt', el).value = F.amount; paintDynamic(); }
      else if ((b = t.closest('[data-qa]'))) { F.amount = wfmt(Number(b.dataset.qa)); $('#fAmt', el).value = F.amount; paintDynamic(); }
      else if ((b = t.closest('#fMode button'))) {
        const grams = b.dataset.g === '1', c = cur(), a = num(F.amount) || 0, gpu = c.us[F.unitIdx] && c.us[F.unitIdx].grams;
        if (grams && !c.g) F.amount = wfmt(gpu ? Math.round(a * gpu) : 100);
        if (!grams && c.g) F.amount = wfmt(gpu ? Math.max(0.25, Math.round(a / gpu * 4) / 4) : 1);
        F.inGrams = grams; paintPortion(); paintDynamic();
      }
      else if ((b = t.closest('[data-u]'))) { F.unitIdx = Number(b.dataset.u); paintPortion(); paintDynamic(); }
      else if ((b = t.closest('#fMeal button'))) { F.meal = b.dataset.m; el.querySelectorAll('#fMeal button').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); }); paintDynamic(); }
      else if ((b = t.closest('[data-x]'))) {
        if (b.dataset.x === 'star') {
          const mine = S.foods.find(f => sameFood(f, fo));
          if (mine) { S.foods = S.foods.filter(f => f.id !== mine.id); toast('Removed from saved foods'); }
          else { const nf = clone(F.food); nf.id = uid(); S.foods.unshift(nf); toast('Saved to my foods'); }
          save(); b.setAttribute('aria-pressed', isSaved(fo)); b.innerHTML = svg('star', isSaved(fo));
        } else {
          const old = S.entries.find(x => x.id === F.editId); if (!old) return;
          S.entries = S.entries.filter(x => x.id !== F.editId); save(); closeSheet();
          toast('Entry removed', () => { S.entries.push(old); });
        }
      }
    });
    $('#fGo', el).onclick = () => {
      const c = cur(); if (!c.pick || !(num(c.pick.amount) > 0)) return toast('Enter an amount above 0');
      // A serving weight added here sticks to the saved food, so grams work next time too.
      if (F.food.servingGrams) { const sf = S.foods.find(x => sameFood(x, F.food) && x.unit === 'serving' && !x.servingGrams); if (sf) sf.servingGrams = F.food.servingGrams; }
      if (editing) {
        const i = S.entries.findIndex(x => x.id === F.editId); if (i < 0) return;
        const old = clone(S.entries[i]);
        S.entries[i] = Object.assign({}, old, { meal: F.meal, base: c.pick.base, baseAmt: c.pick.baseAmt, unit: c.pick.unit, servings: c.pick.servings || [], servingLabel: c.pick.servingLabel, servingGrams: c.pick.servingGrams, amount: c.pick.amount });
        save(); closeSheet(); toast('Entry updated', () => { const j = S.entries.findIndex(x => x.id === old.id); if (j >= 0) S.entries[j] = old; });
      } else {
        const e = logEntry(F.food, c.pick, F.meal, F.date); if (A) A.meal = F.meal;
        save(); closeSheet();
        toast('Added ' + e.name + ' · ' + amtText(e), () => { S.entries = S.entries.filter(x => x.id !== e.id); });
      }
    };
    paintPortion(); paintWeight(); paintDynamic();
  }

  // ---------- init ----------
  // Another tab or the cloud sync changed food_v1: reload S at once (every later save starts from it), then
  // redraw. While a field is focused the redraw waits for blur (and for the tap that caused it), so nothing
  // is rebuilt under the finger mid-typing.
  let blurWait = null;
  function reloadFromStorage() {
    S = load();
    if (blurWait) { blurWait.el.removeEventListener('blur', blurWait.fn); blurWait = null; }
    const a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) {
      const fn = () => { blurWait = null; setTimeout(refresh, 0); };
      a.addEventListener('blur', fn, { once: true }); blurWait = { el: a, fn };
      return;
    }
    refresh();
  }
  window.addEventListener('storage', e => { if (e.key == null || e.key === LS_KEY) reloadFromStorage(); });
  // Tab left open overnight: follow the calendar if the user was looking at "today".
  let seenToday = Day.today();
  function rollDay() { const t = Day.today(); if (t !== seenToday) { if (V.date === seenToday) V.date = t; seenToday = t; refresh(); } }
  window.addEventListener('pageshow', () => { S = load(); rollDay(); refresh(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) rollDay(); });
  document.addEventListener('DOMContentLoaded', () => {
    try { if (window.self !== window.top) return; } catch (e) { return; }
    if (typeof initCloudSync !== 'function') return;
    initCloudSync({ appKey: 'food', syncedKeys: [LS_KEY], onApplied: reloadFromStorage });
  });
  render();
})();
</script>
</body>
</html>
